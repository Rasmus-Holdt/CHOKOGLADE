<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChokoGlade — Italiensk café i Ribe | Antipasti, vafler, kaffe og chokolade</title>
<meta name="description" content="Italiensk café på Nederdammen 32 i Ribe. Antipasti, panini, vafler med gelato, italiensk vin, illy-kaffe og chokolade fra Domori og Venchi. Åbent alle dage.">
<link rel="stylesheet" href="style.css">

<!-- Ikoner til browserfanen og til hjemmeskaermen paa telefonen -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#241109">

<!--
  ============================================================
  CHOKOGLADE — forside
  ------------------------------------------------------------
  Alt skal ligge i samme mappe:

     index.html            denne side
     menukort.html         menukortet
     style.css             alt design + hvilke billeder der bruges
     sprog.js              ALLE tekster, på dansk, engelsk og tysk
     logo.svg              mærket, brugt i topbaren
     favicon.svg           samme mærke, til browserfanen
     billeder/             billederne

  Skal du rette en TEKST      -> sprog.js
  Skal du skifte et BILLEDE   -> style.css, øverst
  Skal du rette DESIGNET      -> style.css

  Begge sider deler topbar, farver, skrifter og bundfelt, så
  en rettelse i style.css slår igennem begge steder.

  ------------------------------------------------------------
  MÆRKET
  ------------------------------------------------------------
  Cirklen står som SVG-kode længere nede i denne fil. Den er
  tegnet efter deres EGET skilt ved døren, ikke opfundet.

  Den SAMME tegning ligger også i to filer:
     logo.svg      det lille mærke i topbaren, begge sider
     favicon.svg   ikonet i browserfanen, med mørk skive bagved

  Retter du cirklen her, skal de to filer rettes med. Det er
  bevidst tre kopier: cirklen her arver farven fra CSS, mens
  de to filer hentes som billeder og selv skal have farven.

  ADVARSEL til de to filer: en SVG der hentes som billede
  parses som XML, og XML tillader ikke to bindestreger i træk
  inde i en kommentar. Skriver du en skillelinje af
  bindestreger derinde, holder hele filen op med at blive
  tegnet. Det er præcis den fejl der fik mærket til at
  forsvinde første gang.

  ------------------------------------------------------------
  KILDER
  ------------------------------------------------------------
  Åbningstider, anmeldelser og stjerner er hentet fra deres
  Google Business-profil den 26. juli 2026. Ændrer de tiderne,
  skal de rettes her OG på Google.

  Historien om Milano kommer fra Ryk Ind Ribes artikel den
  23. april 2024.

  ------------------------------------------------------------
  MANGLER STADIG
  ------------------------------------------------------------
  Priserne på menukortet. Se menukort.html.
  ============================================================
-->
</head>

<body data-page="forside">

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img src="logo.svg" alt="" width="52" height="52">
      <span class="brand-navn">
        Choko<b>Glade</b>
        <small>Café · Cioccolateria</small>
      </span>
    </a>

    <nav class="mainnav">
      <a href="index.html" aria-current="page" data-t="nav.home"></a>
      <a href="menukort.html" data-t="nav.menu"></a>
      <a href="#historien" data-t="nav.story"></a>
      <a href="#besoeg" data-t="nav.visit"></a>
    </nav>

    <nav class="langs" aria-label="Sprog / Language / Sprache">
      <button type="button" data-lang="da" aria-pressed="true">DA</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
    </nav>
  </div>
</header>

<main>

  <!-- ===================== HERO MED EMBLEM ===================== -->
  <section class="hero">

    <svg class="emblem" viewBox="0 0 620 620" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="emblemtitel">
      <title id="emblemtitel">ChokoGlade — Eleonora &amp; Giacomo, Café Cioccolateria, Ribe</title>

      <!-- Buerne teksten løber på.
           Begge løber fra VENSTRE mod HØJRE. Det er vigtigt: gør
           man bunden omvendt, vender SVG bogstaverne på hovedet.
           Øverst r=240 (bogstaverne vokser udad til r=261).
           Nederst r=261 (bogstaverne vokser indad til r=240).
           Så ligger begge tekster i samme bånd, 25 px fra ringen. -->
      <defs>
        <path id="bueOver"  d="M 70,310 A 240,240 0 0 1 550,310"/>
        <path id="bueUnder" d="M 49,310 A 261,261 0 0 0 571,310"/>

        <!-- Skiven, som flagene beskæres af, så de aldrig
             kan stikke uden for ringen -->
        <clipPath id="skive">
          <circle cx="310" cy="310" r="284"/>
        </clipPath>

        <!-- Det iturevne flag-stykke, som på deres eget skilt:
             vandrette baner, flosset kant ind mod teksten, og
             ud til kanten af skiven. Tegnet én gang og brugt
             to gange — den venstre er et spejlbillede. -->
        <g id="flagstykke">
          <path fill="#008C45" d="M 525,264 L 515,275 L 527,286 L 521,296 L 610,292 L 610,258 Z"/>
          <path fill="currentColor" d="M 521,296 L 531,305 L 519,315 L 527,325 L 610,321 L 610,292 Z"/>
          <path fill="#CD212A" d="M 527,325 L 517,335 L 529,345 L 523,356 L 610,352 L 610,321 Z"/>
        </g>
      </defs>

      <circle cx="310" cy="310" r="297" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="310" cy="310" r="286" fill="none" stroke="currentColor" stroke-width="1" opacity=".8"/>

      <!-- Buetekst. textLength låser bredden, så den fylder det
           samme uanset hvilken serif browseren finder. -->
      <g fill="currentColor"
         font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif">
        <text font-size="27" text-anchor="middle">
          <textPath href="#bueOver" startOffset="50%"
                    textLength="452" lengthAdjust="spacingAndGlyphs">ELEONORA &amp; GIACOMO</textPath>
        </text>
        <text font-size="27" text-anchor="middle">
          <textPath href="#bueUnder" startOffset="50%"
                    textLength="462" lengthAdjust="spacingAndGlyphs">CAFÉ · CIOCCOLATERIA</textPath>
        </text>
      </g>

      <!-- De to flag, ved 3 og 9, i det vandrette mellemrum mellem
           de to buetekster. Præcis som på skiltet ved døren. -->
      <g clip-path="url(#skive)">
        <use href="#flagstykke"/>
        <use href="#flagstykke" transform="translate(620,0) scale(-1,1)"/>
      </g>

      <!-- Navnet. textLength=360 -> spænder præcis x 130 til 490. -->
      <text x="310" y="312" fill="currentColor" text-anchor="middle"
            font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif"
            font-style="italic" font-size="78"
            textLength="360" lengthAdjust="spacingAndGlyphs">ChokoGladE</text>

      <!-- Grundlagt. textLength=130 -> spænder x 245 til 375. -->
      <text x="310" y="376" fill="currentColor" text-anchor="middle"
            font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif"
            font-size="23"
            textLength="130" lengthAdjust="spacingAndGlyphs">EST. 2024</text>
      <g stroke="currentColor" stroke-width="1.4">
        <path d="M 176,368 L 222,368"/>
        <path d="M 398,368 L 444,368"/>
      </g>
      <circle cx="233" cy="368" r="3" fill="currentColor"/>
      <circle cx="387" cy="368" r="3" fill="currentColor"/>
    </svg>

    <a class="scrollcue" href="#intro">
      <span></span>
      <span data-t="cta.scroll"></span>
    </a>
  </section>

            </div>
            <div class="fact">

            <div class="fact">

                <div class="hours">

                  <div data-day="fri"><span data-t="visit.fri"></span> <span data-t="visit.h2"></span></div>
